name: ci
on: [push, pull_request]

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      - run: make build
      - run: make test
      - run: make lint

  # A real Linux implementation lives behind internal/power now, not just a stub, so
  # this builds and tests it the same way the macOS job does — `make lint` on either
  # job also cross-builds the other OS's real packages and the Windows stubs, which is
  # what keeps the platform boundary in internal/power honest without a third job.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      - run: make build
      - run: make test
      - run: make lint
